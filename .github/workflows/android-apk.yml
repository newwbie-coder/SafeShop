name: Build Android APK

# Builds the SafeShop Android companion app and publishes the debug APK as a
# downloadable workflow artifact. This lets you grab the APK from GitHub at any
# time (Actions run -> Artifacts), independent of any ephemeral dev VM.

on:
  push:
    branches:
      - "cursor/android-safeshop-companion-7b69"
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL to bake into the APK (e.g. https://safeshop.onrender.com). Leave blank to default to http://127.0.0.1:8000/ (use adb reverse or set it at runtime in-app)."
        required: false
        default: ""

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          if [ -n "${{ github.event.inputs.backend_url }}" ]; then
            ./gradlew :app:assembleDebug --no-daemon -PsafeshopBackendUrl="${{ github.event.inputs.backend_url }}"
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: safeshop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
